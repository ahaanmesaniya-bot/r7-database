<style>

#cross:after{top:8px;left:0;height:2px;width:18px}

.slot i{position:absolute;left:2px;top:-1px;font-size:9px;color:#fff;font-style:normal;text-shadow:0 0 2px #000}
.slot b{position:absolute;right:2px;bottom:-1px;font-size:10px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.slot.sel{border-color:#fff;box-shadow:0 0 0 2px #000;background:rgba(255,255,255,.2)}

#bname{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 62px);color:#fff;font-size:15px;text-shadow:0 0 4px #000,0 0 4px #000;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:6}

#hurt,#wat,#fade{position:fixed;inset:0;pointer-events:none}

#fprog{height:10px;background:#111;border-radius:5px;margin:8px 0;overflow:hidden}#fprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9800,#ffeb3b)}

<script>
window.addEventListener('error',function(e){
  var m=document.getElementById('msg');m.style.display='flex';
  m.firstElementChild.innerHTML='<h3>Error</h3><p>'+(e.message||'unknown')+'</p>';
});
(function(){
let W=128,D=128,maxY=24;const H=128,CS=16,SEA=6,TS=16,AC=20,TS1=1/AC,E=.0006,EXP=48;
let blocks=new Uint16Array(W*H*D);
let light=new Uint8Array(W*H*D);
const DIR=[[1,0],[-1,0],[0,1],[0,-1]];
const idx=(x,y,z)=>(y*D+z)*W+x;
function hash(x,z){const n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n);}
function sm(t){return t*t*(3-2*t);}
function vnoise(x,z){
  const xi=Math.floor(x),zi=Math.floor(z),xf=sm(x-xi),zf=sm(z-zi);
  const a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1);
  return a+(b-a)*xf+(c-a)*zf+(a-b-c+d)*xf*zf;
}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=(a,b)=>a+Math.random()*(b-a);

// ======================= TEXTURE ATLAS =======================
const atlas=document.createElement('canvas');atlas.width=atlas.height=TS*AC;
const actx=atlas.getContext('2d');
const TI={},TAVG=[];let tcount=0;
const NONE=[0,0,0,0];
const nz=(b,v,r)=>{const d=(r()-.5)*v;return [b[0]+d,b[1]+d,b[2]+d];};
const sh=(c,k)=>[c[0]+k,c[1]+k,c[2]+k];
const edge=(x,y)=>x===0||y===0||x===15||y===15;
const circ=(x,y,cx,cy,r)=>(x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r;
const ell=(x,y,cx,cy,a,b)=>((x-cx)*(x-cx))/(a*a)+((y-cy)*(y-cy))/(b*b)<=1;
function tile(name,fn){
  const id=tcount++;TI[name]=id;
  const img=actx.createImageData(TS,TS);
  const r=rng(id*7919+13);
  let sr=0,sg=0,sb=0,sn=0;
  for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){
    const c=fn(x,y,r)||[255,0,255];
    const a=(c[3]===undefined)?255:c[3];
    const o=(y*TS+x)*4;
    img.data[o]=c[0];img.data[o+1]=c[1];img.data[o+2]=c[2];img.data[o+3]=a;
    if(a>128){sr+=c[0];sg+=c[1];sb+=c[2];sn++;}
  }
  TAVG[id]=sn?[sr/sn,sg/sn,sb/sn]:[200,200,200];
  actx.putImageData(img,(id%AC)*TS,Math.floor(id/AC)*TS);
}
function simple(n,b,v,sp,spk){tile(n,(x,y,r)=>{let c=nz(b,v,r);if(sp&&r()<sp)c=sh(c,spk);return c;});}
// nature
const dirtC=(x,y,r)=>{const c=nz([134,96,67],28,r);return r()<.07?sh(c,-30):c;};
const stoneC=(x,y,r)=>{const c=nz([125,125,128],28,r);return hash(x*1.9,y*2.3)>.86?sh(c,-22):c;};
const grassC=(x,y,r)=>nz([98,160,55],34,r);
tile('grass_top',grassC);
tile('grass_side',(x,y,r)=>{const g=3+(((x*5+2)%4)===0?1:0)+(((x*3)%5)===0?1:0);return y<g?grassC(x,y,r):dirtC(x,y,r);});
tile('dirt',dirtC);
tile('farm_top',(x,y,r)=>{const c=nz([84,56,38],20,r);return (x%4===1)?sh(c,-18):c;});
simple('sand',[220,208,152],16);
simple('redsand',[190,102,50],16,.08,-20);
tile('gravel',(x,y,r)=>{const c=nz([132,127,122],54,r);return hash(x*1.1,y*1.7)>.8?sh(c,-30):c;});
simple('clay',[160,166,179],10);
simple('mud',[62,52,44],14,.1,-14);
tile('moss',(x,y,r)=>{const c=nz([88,116,44],34,r);return r()<.12?sh(c,22):c;});
simple('snow',[246,249,252],8);
tile('snow_side',(x,y,r)=>{const g=4+(((x*5+1)%4)===0?1:0);return y<g?nz([246,249,252],8,r):dirtC(x,y,r);});
tile('ice',(x,y,r)=>{const c=nz([140,190,240],14,r);return (x+y)%11===0?sh(c,26):c;});

const srcs=new Map();
const crops=new Map();
let gt=0;
let OX=-(W>>1),OZ=-(D>>1),CX=W>>1,CZ=D>>1;
function rawH(gx,gz){const n=vnoise(gx/22,gz/22)*.6+vnoise(gx/9,gz/9)*.28+vnoise(gx/4,gz/4)*.12;return Math.floor(4+n*17);}
const h0=Math.max(9,Math.min(12,rawH(0,0)));
function inFlat(gx,gz){return false;}
const BN={desert:'Registaan (Desert) 🏜',snowy:'Barfeela ilaaka ❄',taiga:'Taiga (Spruce jungle) 🌲',cherry:'Cherry Grove 🌸',forest:'Ghana Jungle 🌳',plains:'Maidaan (Plains) 🌾',mixed:'Hara-bhara ilaaka 🌿'};let bioT=0,lastBio='';
function biomeAt(gx,gz){if(Math.max(Math.abs(gx),Math.abs(gz))<=26)return 'mixed';
  const t=vnoise(gx/90+13,gz/90+29),m=vnoise(gx/70+51,gz/70+7),c=vnoise(gx/55+101,gz/55+77);
  if(t>.62&&m<.55)return 'desert';if(t<.36)return 'snowy';if(t<.43)return 'taiga';if(c>.66)return 'cherry';if(m>.6)return 'forest';if(m<.4)return 'plains';return 'mixed';}
function colH(gx,gz){let h=rawH(gx,gz);const d=Math.max(Math.abs(gx),Math.abs(gz));if(d<=7)h=h0;else if(d<=12){h=Math.round(h0+(h-h0)*(d-7)/5);}return h;}
function isDesert(gx,gz,h){return biomeAt(gx,gz)==='desert'&&h>=8&&h<=14&&Math.max(Math.abs(gx),Math.abs(gz))>13;}
function genColumn(x,z){
  const gx=x+OX,gz=z+OZ,h=colH(gx,gz),des=isDesert(gx,gz,h),beach=h<=SEA+1,peak=h>=17;
  const bio=biomeAt(gx,gz);
  for(let y=0;y<=h;y++){
    let t;
    if(y===h){t=(beach||des)?ID.sand:((peak||bio==='snowy')?ID.snow:ID.grass);if(!beach&&!des&&!peak&&bio!=='snowy'&&hash(gx/3,gz/3)>.9)t=ID.gravel;}
    else if(y>=h-3){t=(beach||des)?((des&&y<h-1)?ID.sandstone:ID.sand):ID.dirt;}
    else{
      t=ID.stone;
      const r=hash(gx*12.9+y*78.2,gz*37.7+y*3.1);
      if(r<.022)t=ID.coal;
      else if(r<.031&&y<14)t=ID.iron;
      else if(r<.036&&y<9)t=ID.gold;
      else if(r<.039&&y<6)t=ID.diamond;
      else if(r<.044&&y<7)t=ID.redstone;
      else if(r<.046&&y<5)t=ID.emerald;
      else if(r<.052&&y<8)t=ID.lapis;
      else if(r<.07&&y<10)t=ID.deepslate;
      else if(r<.085&&y>5&&y<14)t=ID.andesite;
      else if(r<.095&&y>5&&y<14)t=ID.granite;
      else if(r<.105&&y>5&&y<14)t=ID.diorite;
    }
    blocks[idx(x,y,z)]=t;
  }
  for(let y=h+1;y<=SEA;y++)blocks[idx(x,y,z)]=(y===SEA&&bio==='snowy')?ID.ice:ID.water;
  if(Math.max(h,SEA)>maxY)maxY=Math.max(h,SEA);
}
function setIfAir(x,y,z,t){if(x<0||z<0||x>=W||z>=D||y<0||y>=H)return;const i=idx(x,y,z);if(blocks[i]===0){blocks[i]=t;if(y>maxY)maxY=y;}}
function put(x,y,z,t){const i=idx(x,y,z);blocks[i]=t;if(y>maxY)maxY=y;if(LVL[t])srcs.set(i,LVL[t]);else srcs.delete(i);}
function makeTree(x,h,z,type){
  const rr=hash((x+OX)*1.3,(z+OZ)*2.9);
  if(type==='oak'){
    const th=4+(rr>.5?1:0);
    for(let y=1;y<=th;y++)put(x,h+y,z,ID.log_oak);
    for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=th-2;dy<=th+1;dy++){
      if(Math.abs(dx)+Math.abs(dz)+(dy===th+1?2:0)>3)continue;
      setIfAir(x+dx,h+dy,z+dz,ID.leaves_oak);
    }
  }else if(type==='birch'){
    const th=5+(rr>.5?1:0);
    for(let y=1;y<=th;y++)put(x,h+y,z,ID.log_birch);
    for(let dy=th-2;dy<=th+1;dy++){const rad=dy===th+1?1:2;
      for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){
        if(Math.abs(dx)+Math.abs(dz)>(rad===1?1:3))continue;
        setIfAir(x+dx,h+dy,z+dz,ID.leaves_birch);
      }}
  }else if(type==='spruce'){
    const th=6+(rr>.5?1:0);
    for(let y=1;y<=th;y++)put(x,h+y,z,ID.log_spruce);
    for(let dy=2;dy<=th+2;dy++){
      const k=th+2-dy;const rad=k===0?0:(k<3?1:((k%2===0)?1:2));
      for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){
        if(rad===2&&Math.abs(dx)+Math.abs(dz)>3)continue;
        if(rad===1&&Math.abs(dx)+Math.abs(dz)>1)continue;
        setIfAir(x+dx,h+dy,z+dz,ID.leaves_spruce);
      }
    }
  }else if(type==='cherry'){
    const th=4;
    for(let y=1;y<=th;y++)put(x,h+y,z,ID.log_cherry);
    for(let dy=th-1;dy<=th+1;dy++){const rad=dy===th?3:2;
      for(let dx=-rad;dx<=rad;dx++)for(let dz=-rad;dz<=rad;dz++){
        if(Math.abs(dx)+Math.abs(dz)>rad+1)continue;
        setIfAir(x+dx,h+dy,z+dz,ID.leaves_cherry);
      }}
  }
}
const FL=['flower_red','flower_yellow','flower_blue','flower_pink'];
function decorate(x,z){
  const gx=x+OX,gz=z+OZ;
  if(x<4||z<4||x>=W-4||z>=D-4)return;
  if(Math.max(Math.abs(gx),Math.abs(gz))<=11)return;
  const h=colH(gx,gz);
  if(h<=SEA+1||h+9>=H||blocks[idx(x,h+1,z)]!==0)return;
  const top=blocks[idx(x,h,z)],r=hash(gx*3.1,gz*7.7),bio=biomeAt(gx,gz);
  if(top===ID.sand){
    if(r>(bio==='desert'?.975:.99)){const ch=2+(hash(gx,gz*2.2)>.5?1:0);for(let y=1;y<=ch;y++)put(x,h+y,z,ID.cactus);}
    return;
  }
  if(top===ID.grass||top===ID.snow){
    let th=.982,type='oak';const pick=hash(gx*1.7,gz*2.3);
    if(bio==='snowy'){th=.985;type='spruce';}else if(bio==='taiga'){th=.95;type='spruce';}
    else if(bio==='forest'){th=.93;type=pick>.5?'oak':'birch';}else if(bio==='cherry'){th=.945;type='cherry';}
    else if(bio==='plains'){th=.998;}else{type=pick>.7?'birch':'oak';}

function liq(t){return t===ID.water||t===ID.lava;}
function bulk(cells){

  let x0=1e9,x1=-1,z0=1e9,z1=-1;
  cells.forEach(function(c){const x=c[0],y=c[1],z=c[2];if(x<0||z<0||x>=W||z>=D||y<0||y>=H)return;
    const i=idx(x,y,z),tt=c[3];blocks[i]=tt;edits[(x+OX)+','+y+','+(z+OZ)]=tt;if(tt&&y>maxY)maxY=y;
    if(LVL[tt])srcs.set(i,LVL[tt]);else srcs.delete(i);
    x0=Math.min(x0,x);x1=Math.max(x1,x);z0=Math.min(z0,z);z1=Math.max(z1,z);});
  if(x1<0)return;
  relight();
  const a0=Math.floor(Math.max(0,x0-15)/CS),a1=Math.floor(Math.min(W-1,x1+15)/CS),b0=Math.floor(Math.max(0,z0-15)/CS),b1=Math.floor(Math.min(D-1,z1+15)/CS);

function pour(x,y,z,kind){if(kind==='water'){wpour(x,y,z);return;}
  const T=kind==='water'?ID.water:ID.lava,R=kind==='water'?4:2,cap=kind==='water'?64:22;
  let cy=y;
  while(cy>0&&y-cy<40){const b=get(x,cy-1,z);if(b===0||liq(b))cy--;else break;}
  const q=[[x,z,0]],seen={},cells=[];seen[x+','+z]=1;
  for(let yy=y;yy>cy;yy--)if(get(x,yy,z)===0)cells.push([x,yy,z,T]);
  while(q.length&&cells.length<cap){
    const c=q.shift(),cx=c[0],cz=c[1],d=c[2],g=get(cx,cy,cz);
    if(d>0&&get(cx,cy-1,cz)===0)continue;
    if(g===0)cells.push([cx,cy,cz,T]);
    else if(g===ID.lava&&kind==='water')cells.push([cx,cy,cz,ID.obsidian]);
    else if(g!==T)continue;
    if(d<R)DIR.forEach(function(dd){const k=(cx+dd[0])+','+(cz+dd[1]);if(!seen[k]){seen[k]=1;q.push([cx+dd[0],cz+dd[1],d+1]);}});
  }
  bulk(cells);
  if(kind==='water')tone(260,.25,'sine',.1,1.8);else tone(110,.3,'sawtooth',.08,.6);
  toast(kind==='water'?'Paani 💧 (ek hi balti, kabhi khatam nahi)':'Lava 🔥 savdhaan!');
}

  for(let x=cx-5;x<=cx+5;x++)for(let z=cz-5;z<=cz+5;z++)for(let y=cy-3;y<=cy+3;y++)if(liq(get(x,y,z)))cells.push([x,y,z,0]);
  cells.forEach(function(c){wl.delete(wk(c[0],c[1],c[2]));});wl.forEach(function(v,k){wq.add(k);});

}

function drawTag(a){

    g.font='bold 20px sans-serif';let tx=a.btxt;
    while(g.measureText(tx).width>232&&tx.length>4)tx=tx.slice(0,-2);
    const w=Math.min(250,g.measureText(tx).width+18);
    g.fillStyle='rgba(255,255,255,.96)';g.fillRect(128-w/2,2,w,28);
    g.strokeStyle='#222';g.lineWidth=2;g.strokeRect(128-w/2,2,w,28);
    g.fillStyle='#111';g.textAlign='center';g.fillText(tx,128,24);
  }

}

function vtick(a,dt){

    }else if(a.fd>=12&&a.hp<a.def.hp)a.hp++;

}
function feedVillager(v,id){

  if(v.fd>=19){speak(v,'Pet bhara hai 😊');return;}
  stock[id]--;v.fd=Math.min(20,v.fd+BL[id].food*1.5);
  sfx.eat();burst(v.x,v.y+1.2,v.z,0xffd060,6);speak(v,'Shukriya Raja! 😋');if(!v.baby&&v.fd>=12){v.love=25;burst(v.x,v.y+2.2,v.z,0xff4488,8);}refreshHot();drawTag(v);
}
function feedAll(tg){
  let n=0,none=false;
  tg.forEach(function(v){
    let guard=0;
    while(v.fd<=12&&guard++<8){
      let best=0;
      for(const k in stock){const id=+k;if(stock[id]>0&&BL[id].food&&(!best||BL[id].food>BL[best].food))best=id;}
      if(!best){none=true;break;}
      stock[best]--;v.fd=Math.min(20,v.fd+BL[best].food*1.5);n++;
    }
    drawTag(v);
  });
  refreshHot();
  if(n){sfx.eat();tg.forEach(function(v){speak(v,'Shukriya Raja! 😋');});say(tg[0],'Khana mil gaya, shukriya! ('+n+' cheezein baanti)');}
  else if(none)say(tg[0],'Raja, tumhare paas khana khatam hai! Kheti/shikar karo 🌾');
  else say(tg[0],'Abhi pet bhara hai 😊');
}

function jobFor(kind,mk,f){
  const d=DIR[f],pp=[-d[1],d[0]],px0=Math.floor(P.x),pz0=Math.floor(P.z),mat=ID[mk],L=[];
  const add=function(x,y,z,t){if(t===0&&get(x,y,z)===0)return;L.push({x:x,y:y,z:z,t:t});};
  let st={x:px0+d[0]*2+.5,z:pz0+d[1]*2+.5};
  if(kind==='house'){
    const cx=px0+d[0]*7,cz=pz0+d[1]*7,gy=surfY(cx,cz);
    for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let y=1;y<=4;y++)add(cx+dx,gy+y,cz+dz,0);
    for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)add(cx+dx,gy,cz+dz,mat);
    for(let y=1;y<=3;y++)for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++){
      if(Math.abs(dx)!==2&&Math.abs(dz)!==2)continue;
      const door=(dx===-2*d[0]&&dz===-2*d[1]),corner=Math.abs(dx)===2&&Math.abs(dz)===2;
      if(door&&y<=2)continue;
      let t=mat;if(corner)t=ID.log_oak;else if(y===2&&(dx===0||dz===0)&&!door)t=ID.glass;
      add(cx+dx,gy+y,cz+dz,t);
    }
    for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)add(cx+dx,gy+4,cz+dz,ID.planks_spruce);
    add(cx-1,gy+1,cz,BEDF[2]);add(cx-1,gy+1,cz+1,BEDH[2]);add(cx+1,gy+1,cz-1,ID.torch);
  }else if(kind==='tower'){
    const cx=px0+d[0]*6,cz=pz0+d[1]*6,gy=surfY(cx,cz);
    for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)add(cx+dx,gy,cz+dz,mat);
    for(let y=1;y<=12;y++)for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
      if(dx===0&&dz===0)continue;
      const door=(dx===-d[0]&&dz===-d[1]);
      if(door&&y<=2)continue;
      add(cx+dx,gy+y,cz+dz,((y===6||y===9)&&(dx===0||dz===0)&&!door)?ID.glass:mat);
    }
    for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)add(cx+dx,gy+12,cz+dz,mat);
    [[-2,-2],[2,-2],[-2,2],[2,2]].forEach(function(c){add(cx+c[0],gy+13,cz+c[1],ID.torch);});
  }else if(kind==='wall'){
    const cx=px0+d[0]*6,cz=pz0+d[1]*6;
    for(let i=-6;i<=5;i++){const x=cx+pp[0]*i,z=cz+pp[1]*i,gy=surfY(x,z);for(let y=1;y<=3;y++)add(x,gy+y,z,mat);}
  }else if(kind==='stairs'){
    const bx0=px0+d[0]*4,bz0=pz0+d[1]*4,gy=surfY(bx0,bz0),pre=STP[mk]||'stair_planks_oak_';
    for(let i=0;i<10;i++)for(let w=-1;w<=1;w++)add(bx0+d[0]*i+pp[0]*w,gy+1+i,bz0+d[1]*i+pp[1]*w,ID[pre+f]);
  }else if(kind==='pen'){
    const cx=px0+d[0]*8,cz=pz0+d[1]*8,gy=surfY(cx,cz);
    for(let dx=-4;dx<=4;dx++)for(let dz=-4;dz<=4;dz++){const e=Math.abs(dx)===4||Math.abs(dz)===4,gate=(dx===-4*d[0]&&dz===-4*d[1]);
      for(let y=1;y<=2;y++){if(e&&!(gate&&y<=2))add(cx+dx,gy+y,cz+dz,mat);else if(!e)add(cx+dx,gy+y,cz+dz,0);}
      if(e&&Math.abs(dx)===4&&Math.abs(dz)===4)add(cx+dx,gy+3,cz+dz,ID.torch);}
    L.pen={cx:cx,cz:cz};
  }else if(kind==='bed'){
    const bx0=px0+d[0]*3,bz0=pz0+d[1]*3,gy=surfY(bx0,bz0);
    for(let i=-2;i<=2;i++){const x=bx0+pp[0]*i*2,z=bz0+pp[1]*i*2;add(x,gy+1,z,BEDF[2]);add(x,gy+1,z+1,BEDH[2]);}

  }
  return {list:L,stand:st,pen:L.pen};
}

function raycast(){
  const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  const o=camera.position;
  let px=-1,py=-1,pz=-1;
  for(let d=0;d<6;d+=0.04){
    const x=Math.floor(o.x+dir.x*d),y=Math.floor(o.y+dir.y*d),z=Math.floor(o.z+dir.z*d);
    if(x<0||z<0||x>=W||z>=D||y<0||y>=H)continue;
    const t=blocks[idx(x,y,z)];
    if(t&&t!==ID.water)return {x:x,y:y,z:z,px:px,py:py,pz:pz,d:d};
    px=x;py=y;pz=z;
  }
  return null;
}

    if(hunger>=14&&health<20)health=Math.min(20,health+1);
    else if(hunger<=0&&health>2){health-=1;hurtEl.style.opacity=1;setTimeout(function(){hurtEl.style.opacity=0;},120);}
