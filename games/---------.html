<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Escape - Play Game</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a262f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .game-box {
            text-align: center;
            color: white;
            background: #243441;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .game-icon {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .play-btn {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
            cursor: pointer;
        }

        .play-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="game-box">
        <!-- ગેમનો લોગો (જો તમારી પાસે ઈમેજ હોય તો અહી પાથ બદલી શકો) -->
        <img src="https://img.famobi.com/portal/html5games/images/tmp/GoEscapeTeaser.jpg" alt="Go Escape" class="game-icon">
        <h2>Go Escape</h2>
        <p style="color: #a0aec0; margin-bottom: 25px;">ગેમ રમવા માટે નીચે આપેલા બટન પર ક્લિક કરો</p>
        
        <!-- આ બટન ગેમને સીધી ઓપન કરશે જેથી બ્લોક થવાનો પ્રશ્ન જ ન રહે -->
        <a href="https://play.famobi.com/go-escape" class="play-btn">Play Now</a>
    </div>

</body>
</html>
