header{position:relative;display:flex;justify-content:space-between;align-items:center;height:78px;z-index:5}
.lvlwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;white-space:nowrap}
.lvl{font:900 clamp(28px,9vw,40px)/1 "Arial Rounded MT Bold","Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;letter-spacing:2px;color:#fff;
text-shadow:-3px -3px 0 #0b5c6b,3px -3px 0 #0b5c6b,-3px 3px 0 #0b5c6b,3px 3px 0 #0b5c6b,0 -3px 0 #0b5c6b,0 3px 0 #0b5c6b,-3px 0 0 #0b5c6b,3px 0 0 #0b5c6b,0 6px 0 #08414c,0 10px 12px rgba(0,0,0,.25)}
.lvl.boss{color:#ffd447;text-shadow:-3px -3px 0 #7a1d00,3px -3px 0 #7a1d00,-3px 3px 0 #7a1d00,3px 3px 0 #7a1d00,0 -3px 0 #7a1d00,0 3px 0 #7a1d00,-3px 0 0 #7a1d00,3px 0 0 #7a1d00,0 6px 0 #4a1000,0 10px 12px rgba(0,0,0,.3)}
.bosstag{display:none;margin:7px auto 0;width:max-content;font-size:12px;font-weight:900;letter-spacing:1.5px;color:#fff;background:linear-gradient(#ff5a44,#d12b1c);border:2px solid #000;border-radius:10px;padding:2px 10px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.bosstag.on{display:block}
.hdr{display:flex;gap:10px;position:relative;z-index:6}
.ib{border:0;background:none;padding:0;cursor:pointer;width:var(--bs,54px);flex:none;transition:transform .1s;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2));-webkit-user-drag:none;touch-action:manipulation}
.ib img{width:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.ib:active{transform:translateY(3px) scale(.93);filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
.ib[disabled]{opacity:.45;filter:grayscale(.6);pointer-events:none}
.ib.big{width:min(62vw,240px)}
.plus{width:100%;aspect-ratio:1;border-radius:50%;background:linear-gradient(#ff9468,#FF7A4D);border:4px solid #000;color:#fff;font:900 34px/1 system-ui,sans-serif;display:grid;place-items:center;text-shadow:0 2px 0 rgba(0,0,0,.3);padding-bottom:3px}

.tube.done{animation:pop .55s ease-out;filter:drop-shadow(0 0 8px rgba(255,214,70,.9))}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14,.9)}70%{transform:scale(.96,1.06)}100%{transform:scale(1)}}
.wob{animation:wob .55s ease-out;transform-origin:50% 100%}
@keyframes wob{0%{transform:rotate(0)}25%{transform:rotate(3.5deg)}55%{transform:rotate(-2.5deg)}80%{transform:rotate(1deg)}100%{transform:rotate(0)}}
.stream{position:absolute;width:7px;border-radius:4px;pointer-events:none;z-index:30;transform-origin:50% 0;box-shadow:inset -2px 0 0 rgba(0,0,0,.1),inset 2px 0 0 rgba(255,255,255,.4)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0));transform:translate(-50%,20px);background:rgba(11,92,107,.92);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:86%;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{display:flex;gap:20px;justify-content:center;align-items:center;padding:10px 0 22px;position:relative;z-index:5}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;text-align:center;z-index:60;overflow:hidden;background:#1d7bf0;padding:16px}
#win.on{display:flex}
#win::before{content:"";position:absolute;left:-60%;top:-60%;width:220%;height:220%;background:repeating-conic-gradient(from 0deg at 50% 50%,#3a96ff 0 6deg,#1f79f0 6deg 12deg);animation:spin 50s linear infinite;will-change:transform}
#win::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 28%,rgba(255,255,255,.28),transparent 70%),linear-gradient(transparent 45%,rgba(0,40,140,.5))}
#win>*{position:relative;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}
.wt{font-size:clamp(34px,11vw,54px);font-weight:900;color:#fff;margin:0;text-shadow:0 4px 0 rgba(8,50,130,.55),0 8px 18px rgba(0,0,0,.25);animation:rise .6s cubic-bezier(.3,1.6,.5,1) both}
.wl{font-size:clamp(26px,8vw,40px);font-weight:800;color:#fff;margin:0;text-shadow:0 3px 0 rgba(8,50,130,.5);animation:rise .6s cubic-bezier(.3,1.6,.5,1) .12s both}
@keyframes rise{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.stars{display:flex;gap:8px;justify-content:center;margin:2vh 0}
.stars svg{width:clamp(70px,24vw,108px);height:auto;transform:scale(0);filter:drop-shadow(0 5px 0 rgba(120,70,0,.35))}
.stars svg.on{animation:starin .55s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes starin{from{transform:scale(0) rotate(-50deg)}to{transform:scale(1) rotate(0)}}
.wm{color:#fff;font-weight:900;font-size:20px;margin:0 0 1vh;text-shadow:0 2px 0 rgba(8,50,130,.55)}
.rl{color:#fff;font-weight:800;font-size:15px;margin-top:-4px;text-shadow:0 2px 0 rgba(8,50,130,.55)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
@media (prefers-reduced-motion:reduce){#win::before{animation:none}}
</style>

/* ---------- levels: 500, getting harder; every 10th is a boss ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function cfg(l){
  var boss=l%BOSS_EVERY===0,n,cap=4;
  if(boss)cap=Math.min(8+(l/BOSS_EVERY-1),14);
  n=boss?Math.min(4+Math.floor((l/BOSS_EVERY-1)/12),6):Math.min(3+Math.floor((l-1)/6),12);
  /* harder levels: no empty tube at the start, and the trickiest of several layouts is picked */
  var spread=boss?l>=30:(l>40&&l%3!==0);

    var ok=true,a,b,i;

        if(B.length>=cap)continue;
        if(B.length&&B[B.length-1]!==col)continue;
        if(!B.length&&r===A.length)continue;
        var n=Math.min(r,cap-B.length),sc=(B.length?2:0)+(B.length+n===cap?3:0)+(n===r&&A.length>r?1:0);

      var m=mv[i],ns=t.map(function(x){return x.slice()});

  for(i=pool.length-1;i>0;i--){j=Math.floor(r()*(i+1));t=pool[i];pool[i]=pool[j];pool[j]=t}
  if(!spread){for(i=0;i<T;i++)lens.push(i<c.n?c.cap:0)}
  else{for(i=0;i<T;i++)lens.push(c.cap);var rem=c.emp*c.cap;while(rem>0){var q=Math.floor(r()*T);if(lens[q]>0){lens[q]--;rem--}}}
  var tu=[],pos=0;
  for(i=0;i<T;i++){tu.push(pool.slice(pos,pos+lens[i]));pos+=lens[i]}

function build(l,c){
  var best=null,bl=-1,found=0,fails=0,att,spread=c.spread;
  for(att=0;att<90&&found<c.k;att++){
    var tu=make(rng(l*7919+13+att*104729),c,spread);
    if(tu.some(function(x){return isFull(x,c.cap)}))continue;
    var p=solve(tu,c.cap,20000);
    if(p){found++;if(p.length>bl){bl=p.length;best=tu}}
    else if(++fails>=12)spread=false;
  }
  if(best)return best;

/* ---------- rules ---------- */
function top(tb){return tb[tb.length-1]}
function run(tb){var c=top(tb),n=0;for(var i=tb.length-1;i>=0&&tb[i]===c;i--)n++;return n}
function canPour(a,b){if(a===b)return false;var A=tubes[a],B=tubes[b];if(!A.length||B.length>=CAP)return false;return !B.length||top(B)===top(A)}
function isDone(tb){return isFull(tb,CAP)}
function won(){return tubes.every(function(tb){return !tb.length||isDone(tb)})}
function hasMoves(){
  for(var a=0;a<tubes.length;a++)for(var b=0;b<tubes.length;b++){
    if(!canPour(a,b))continue;
    if(!tubes[b].length&&run(tubes[a])===tubes[a].length)continue;
    return true;
  }return false;
}

/* ---------- dom ---------- */
function uh(){return (100/CAP)+"%"}
function mkUnit(c,h){var u=document.createElement("div");u.className="unit";u.style.background=COLORS[c];u.style.height=h;return u}
function mkTube(){
  var d=document.createElement("div");d.className="tube"+(BOSS?" boss":"");
  d.innerHTML='<div class="liq"><div class="stack"></div></div><div class="glass"></div>';
  d.addEventListener("pointerdown",function(e){e.preventDefault();tap(els.indexOf(d))});
  return d;
}
function fillTube(i){
  var st=els[i].querySelector(".stack");st.innerHTML="";
  tubes[i].forEach(function(c){st.appendChild(mkUnit(c,uh()))});
  els[i].classList.toggle("sel",sel===i);
}
function setMode(boss,cap){

}

function sizeBoss(){
  var n=tubes.length,W=$("app").clientWidth-28,H=board.clientHeight-64;
  var tw=Math.floor(Math.max(26,Math.min(64,(W-(n-1)*12)/n))),th=Math.floor(Math.min(H,tw*14));

function sizeTubes(){
  if(BOSS){sizeBoss();return}
  var n=tubes.length,W=$("app").clientWidth-28,H=board.clientHeight-64,p,opts=[],mx=0;
  for(p=2;p<=n;p++){
    var rows=Math.ceil(n/p),tw=Math.min(72,(W-(p-1)*12)/p,(H-(rows-1)*34)/(rows*ASP));

  var side=Math.max(0,Math.floor((W-(per*best+(per-1)*12)-1)/2));

  if(sel===i){els[i].classList.remove("sel");sel=null;return}
  if(canPour(sel,i)){var a=sel;sel=null;clearHand();pour(a,i)}
  else{clearHand();els[sel].classList.remove("sel");sel=tubes[i].length?i:null;if(sel!==null){els[i].classList.add("sel");sPick()}}
}
function pour(a,b){
  busy=true;head();
  var A=tubes[a],B=tubes[b],n=Math.min(run(A),CAP-B.length),c=top(A);
  var src=els[a],dst=els[b],tw=src.offsetWidth,th=src.offsetHeight;
  var s=(dst.offsetLeft+dst.offsetWidth/2>=src.offsetLeft+tw/2)?1:-1;
  var ang=BOSS?28:52,half=.26*tw,rad=ang*Math.PI/180;
  var tx=dst.offsetLeft+tw/2,ty=dst.offsetTop;
  var spoutDX=s*half*Math.cos(rad),spoutDY=half*Math.sin(rad);
  var px=tx-spoutDX,py=ty-.5*tw-spoutDY;
  var dx=px-(src.offsetLeft+tw/2),dy=py-src.offsetTop;
  var D=Math.max(380,Math.min(1300,n*250));
  src.classList.remove("sel");src.style.zIndex=20;
  src.style.transition="transform .34s cubic-bezier(.25,.8,.3,1)";
  src.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(s*ang)+"deg)";
  var st=document.createElement("div");st.className="stream";st.style.background=COLORS[c];
  var sx=tx-3.5,sy=py+spoutDY;
  var surf=dst.offsetTop+th*(LO-SPAN*B.length/CAP);
  st.style.left=sx+"px";st.style.top=sy+"px";st.style.height=Math.max(8,surf-sy)+"px";
  st.style.transform="scaleY(0)";st.style.transition="transform .18s ease-in";
  setTimeout(function(){
    board.appendChild(st);void st.offsetWidth;st.style.transform="scaleY(1)";
    sGlug(D);
    var us=src.querySelectorAll(".unit"),k;
    src.style.transition="transform "+D+"ms ease-in-out";
    src.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(s*(ang+(BOSS?8:14)))+"deg)";
    for(k=us.length-n;k<us.length;k++){us[k].style.transition="height "+D+"ms linear";us[k].style.height="0%"}
    var tst=dst.querySelector(".stack"),nu=[];
    for(k=0;k<n;k++){var u=mkUnit(c,"0%");tst.appendChild(u);nu.push(u)}
    void tst.offsetWidth;
    nu.forEach(function(u){u.style.transition="height "+D+"ms linear";u.style.height=uh()});
    setTimeout(function(){
      st.style.transformOrigin="50% 100%";st.style.transition="transform .16s ease-in";st.style.transform="scaleY(0)";
      src.style.transition="transform .34s cubic-bezier(.34,1.35,.5,1)";src.style.transform="";
      setTimeout(function(){
        if(st.parentNode)st.parentNode.removeChild(st);
        undoStack.push(JSON.stringify(tubes));
        for(var q=0;q<n;q++){A.pop();B.push(c)}
        moves++;
        src.style.transition="";src.style.zIndex="";
        fillTube(a);fillTube(b);busy=false;head();buzz(14);wob(a);wob(b);
        if(isDone(B)){dst.classList.remove("done");void dst.offsetWidth;dst.classList.add("done");sDone();cheer(dst,c)}
        if(won()){winScreen()}
        else if(!hasMoves()){say(added?"No moves left. Undo or restart.":"No moves left. Add a tube or undo.")}
      },340);
    },D+30);
  },340);
}
function wob(i){var s=els[i].querySelector(".stack");s.classList.remove("wob");void s.offsetWidth;s.classList.add("wob")}

/* ---------- hint + tutorial hand ---------- */
function clearHand(){hintMv=null;if(hand&&hand.parentNode)hand.parentNode.removeChild(hand);hand=null}
function placeHand(i){
  var e=els[i],w=e.offsetWidth;
  if(!hand){hand=document.createElement("img");hand.className="hand";hand.src=IMG.hand;board.appendChild(hand)}
  hand.style.width=Math.round(w*.9)+"px";
  hand.style.left=(e.offsetLeft+w*.35)+"px";hand.style.top=(e.offsetTop+e.offsetHeight*.45)+"px";
}
function showHint(quiet){
  var best=null,bs=-1,a,b;
  for(a=0;a<tubes.length;a++)for(b=0;b<tubes.length;b++){
    if(!canPour(a,b))continue;
    if(!tubes[b].length&&run(tubes[a])===tubes[a].length)continue;
    var sc=(tubes[b].length?2:0)+(run(tubes[a])===tubes[a].length?1:0)+(tubes[b].length+run(tubes[a])===CAP?2:0);
    if(sc>bs){bs=sc;best={a:a,b:b}}
  }
  if(!best){if(!quiet)say("No good move. Try Undo or add a tube.");return}
  if(sel!==null&&sel!==best.a){els[sel].classList.remove("sel");sel=null}
  clearHand();hintMv=best;placeHand(best.a);
}

/* ---------- effects: confetti + fireworks (one canvas) ---------- */
var cv=$("fx"),cx=cv.getContext("2d"),parts=[],raf=0,last=0,dpr=1,rainOn=false,fxTs=[];
var PAL=["#ff4d5e","#3d8bff","#ffd23f","#35d07f","#b05cff","#ff8a30","#19d3da","#ff6fb5"];
function fit(){dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr)}
fit();window.addEventListener("resize",fit);
function rnd(a,b){return a+Math.random()*(b-a)}
function paper(x,y,vx,vy,c,life){parts.push({k:0,x:x,y:y,vx:vx,vy:vy,w:rnd(6,11),h:rnd(9,16),r:rnd(0,6.28),vr:rnd(-9,9),fl:rnd(0,6.28),c:c,life:life,t:0})}
function burst(x,y,n,spread,power,cols){
  for(var i=0;i<n;i++){var a=-Math.PI/2+rnd(-spread,spread),sp=rnd(power*.45,power);paper(x,y,Math.cos(a)*sp,Math.sin(a)*sp,cols[i%cols.length],rnd(1.3,2.2))}
  fxRun();
}
function firework(x,y){
  var c1=PAL[Math.floor(rnd(0,PAL.length))],c2="#fff6b0",n=46;
  for(var i=0;i<n;i++){var a=i/n*6.2832+rnd(-.06,.06),sp=rnd(110,300)*(i%2?1:.62);
    parts.push({k:1,x:x,y:y,px:x,py:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:i%3?c1:c2,life:rnd(.8,1.4),t:0})}
  fxRun();
}
function fxRun(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}
function loop(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  if(rainOn){for(var q=0;q<2;q++)if(Math.random()<.7)paper(rnd(0,innerWidth),-14,rnd(-40,40),rnd(140,260),PAL[Math.floor(rnd(0,PAL.length))],rnd(3.5,5))}
  var alive=[];
  for(var i=0;i<parts.length;i++){
    var p=parts[i];p.t+=dt;if(p.t>=p.life)continue;
    if(p.k===0){
      p.vy+=(p.vy<260?520:60)*dt;p.vx*=1-1.5*dt;p.x+=p.vx*dt+Math.sin(p.fl+p.t*7)*.7;p.y+=p.vy*dt;p.r+=p.vr*dt;
      var al=p.t>p.life-.4?(p.life-p.t)/.4:1;
      cx.save();cx.globalAlpha=al;cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,Math.cos(p.fl+p.t*9));
      cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();
    }else{
      p.px=p.x;p.py=p.y;p.vy+=170*dt;p.vx*=1-1.1*dt;p.vy*=1-1.1*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
      var f=1-p.t/p.life;cx.globalAlpha=f;cx.strokeStyle=p.c;cx.lineWidth=2.6*f+.6;cx.lineCap="round";
      cx.beginPath();cx.moveTo(p.px,p.py);cx.lineTo(p.x,p.y);cx.stroke();cx.globalAlpha=1;
    }
    alive.push(p);
  }
  parts=alive;
  if(parts.length||rainOn)raf=requestAnimationFrame(loop);else{raf=0;cx.clearRect(0,0,innerWidth,innerHeight)}
}
function stopFx(){rainOn=false;parts=[];fxTs.forEach(clearTimeout);fxTs=[]}
function cheer(el,c){
  var r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height*.08;
  burst(x,y,36,.95,560,[COLORS[c],"#ffd23f","#ff4d5e","#3d8bff","#35d07f","#b05cff","#ff8a30"]);
  firework(x,r.top+r.height*.2);
  buzz([18,40,28]);
}

/* ---------- level complete: stars + next + replay ---------- */
function winScreen(){
  var c=cfgNow,units=c.n*c.cap,done=level,i;
  var st=moves<=(c.boss?c.n*5+6:c.n*3+4)?3:(moves<=(c.boss?c.n*8+10:c.n*4.8+6)?2:1);
  buzz([40,60,40,60,160]);
  level++;if(level>MAXL)level=1;save();
  var nb=level%BOSS_EVERY===0;
  $("winmsg").textContent=done>=MAXL?"All 500 levels done! Starting again":(nb?"Next: BOSS LEVEL "+level:"Next: Level "+level);
  var S=$("stars");S.innerHTML="";
  for(i=0;i<3;i++)S.innerHTML+='<svg viewBox="0 0 24 24"><path d="M12 1.8l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.5 5.7 21.2l1.5-7.1L1.8 9.2 9 8.4z" fill="'+(i<st?"#FFD43B":"#c3d2e8")+'" stroke="'+(i<st?"#E8A400":"#9fb2cc")+'" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  $("replay").onclick=function(){start(done)};
  fxTs.push(setTimeout(function(){
    $("win").classList.add("on");sWin();
    var ss=S.querySelectorAll("svg");
    for(i=0;i<3;i++)(function(k){fxTs.push(setTimeout(function(){ss[k].classList.add("on");buzz(14)},650+k*330))})(i);
    rainOn=true;fxRun();
    fxTs.push(setTimeout(function(){rainOn=false},5200));
    for(i=0;i<9;i++)(function(k){fxTs.push(setTimeout(function(){firework(rnd(.12,.88)*innerWidth,rnd(.1,.45)*innerHeight);buzz(10)},250+k*430+rnd(0,180)))})(i);
  },900));
}

/* ---------- buttons ---------- */
$("undo").onclick=function(){if(busy||!undoStack.length)return;tubes=JSON.parse(undoStack.pop());sel=null;if(moves>0)moves--;added=tubes.length>cfgNow.n+cfgNow.emp;clearHand();buildBoard()};
$("add").onclick=function(){if(busy||added)return;added=true;tubes.push([]);var d=mkTube();els.push(d);board.appendChild(d);sizeTubes();head()};
$("restart").onclick=function(){if(!busy)start(level)};
$("next").onclick=function(){start(level)};
$("snd").onclick=function(){muted=!muted;icons();save()};
$("vib").onclick=function(){vib=!vib;icons();save();buzz(20)};
$("hint").onclick=function(){if(!busy)showHint(false)};
window.addEventListener("resize",sizeTubes);

document.addEventListener("pointerdown",function(e){loadSnd();var t=e.target;if(t&&t.closest&&t.closest(".ib"))sPick()},true);
load();icons();loadSnd();start(level);
})();
</script>
