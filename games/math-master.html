<!DOCTYPE html>
<html lang="hi" data-accent="yellow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Master</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ECC443;
    --hue: 0deg;
    --page: #FDF0CF;
    --paper: #FFFFFF;
    --line: #E9EEF9;
    --margin: #D3DFF7;
    --ink: #111111;
    --frame: #111111;
    --bad: #D93025;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-accent="blue"]   { --accent: #4C9AFF; --page: #DDEBFF; --hue: 169deg; }
  :root[data-accent="green"]  { --accent: #46C37B; --page: #DDF5E6; --hue: 94deg; }
  :root[data-accent="pink"]   { --accent: #FF7EB3; --page: #FFE3EF; --hue: 284deg; }
  :root[data-accent="orange"] { --accent: #FF9A3C; --page: #FFE8CF; --hue: -18deg; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #16130C; --paper: #221E16; --line: #2D2920; --margin: #34405F;
      --ink: #F4EEDC; --frame: #F4EEDC; --bad: #FF7B72;
    }
  }
  :root[data-theme="dark"] {
    --page: #16130C; --paper: #221E16; --line: #2D2920; --margin: #34405F;
    --ink: #F4EEDC; --frame: #F4EEDC; --bad: #FF7B72;
  }
  html { height: 100%; background: var(--page); scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    height: 100%; margin: 0; background: var(--page); color: var(--ink);
    font-family: "Lexend", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-weight: 800;
    -webkit-tap-highlight-color: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .app { height: 100%; max-width: 480px; margin: 0 auto; padding: 0; }
  .frame {
    position: relative; height: 100%; overflow: hidden; display: flex; flex-direction: column;
    background: radial-gradient(120% 90% at 50% -10%, var(--paper) 0%, var(--page) 72%);
  }
  .frame.shk { animation: fshake .45s; }
  @keyframes fshake { 10% { transform: translate(-9px, 3px); } 30% { transform: translate(8px, -3px); } 50% { transform: translate(-6px, 2px); } 70% { transform: translate(4px, -1px); } 90% { transform: translate(-2px, 0); } }

  .scr { position: relative; z-index: 1; display: none; flex: 1; flex-direction: column; padding: 16px 16px 18px; min-height: 0; }
  .scr.on { display: flex; animation: scrIn .28s ease-out; }
  @keyframes scrIn { from { opacity: 0; transform: translateY(10px); } }

  .sticker {
    color: #fff;
    text-shadow: -2px -2px 0 #111, 2px -2px 0 #111, -2px 2px 0 #111, 2px 2px 0 #111, 0 -2px 0 #111, 0 2px 0 #111, -2px 0 0 #111, 2px 0 0 #111, 0 3px 0 #111;
  }

  /* ---------- real asset images ---------- */
  .ai { display: block; width: 100%; height: auto; filter: hue-rotate(var(--hue)); pointer-events: none; -webkit-user-drag: none; }
  .ai.nof { filter: none; }
  .ib { position: relative; flex: none; width: 58px; height: 58px; padding: 0; border: 0; background: none; transition: transform .1s; }
  .ib:active { transform: scale(.88); }
  .pillbtn { position: relative; display: block; width: 100%; max-width: 330px; padding: 0; border: 0; background: none; transition: transform .1s; }
  .pillbtn:active { transform: scale(.96); }
  .bal {
    position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%);
    background: #fff; color: #111; border: 3px solid #111; border-radius: 999px; padding: 0 8px; font-size: 12px; line-height: 18px; font-weight: 900; white-space: nowrap;
  }
  .bal.bump, .pill.bump, .stat.bump { animation: bump .4s; }
  @keyframes bump { 40% { transform: translateX(-50%) scale(1.35); } }
  .pill.bump, .stat.bump { animation-name: bump2; }
  @keyframes bump2 { 40% { transform: scale(1.25); } }
  .dot { position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; border-radius: 50%; background: #FF3B30; border: 3px solid #fff; animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.25); } }
  .wobble { animation: wobble 3.2s ease-in-out infinite; }
  @keyframes wobble { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-14deg); } 80% { transform: rotate(12deg); } 90% { transform: rotate(-6deg); } }

  .toprow { display: flex; justify-content: space-between; align-items: flex-start; padding: 0 2px 18px; }

  /* ---------- floating background symbols ---------- */
  .fl { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .fl span { position: absolute; font-weight: 900; color: var(--ink); opacity: .07; animation: floaty var(--d, 6s) ease-in-out infinite alternate; }
  @keyframes floaty { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-22px) rotate(10deg); } }

  /* ---------- splash ---------- */
  .splash { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: var(--paper); border-radius: 32px; text-align: center; padding: 20px; }
  .splash.on { display: flex; }
  .splash.out { animation: splashOut .35s forwards; }
  @keyframes splashOut { to { opacity: 0; transform: scale(1.06); } }
  .sp-title { margin: 0; font-size: 62px; line-height: .98; font-weight: 900; animation: titleIn .9s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes titleIn { from { transform: scale(.3) rotate(-12deg); opacity: 0; } }
  .sp-badges { display: flex; gap: 12px; }
  .sp-badges b { width: 52px; height: 52px; display: grid; place-items: center; border: 4px solid #111; border-radius: 16px; background: var(--accent); font-size: 32px; line-height: 1; color: #111; animation: hop 1s ease-in-out infinite; animation-delay: calc(var(--i) * 120ms); }
  @keyframes hop { 50% { transform: translateY(-12px) rotate(6deg); } }
  .sp-bar { width: 200px; height: 16px; border: 4px solid var(--frame); border-radius: 999px; overflow: hidden; background: var(--paper); }
  .sp-bar i { display: block; width: 0; height: 100%; background: var(--accent); animation: load 1.3s ease-in-out forwards; }
  @keyframes load { to { width: 100%; } }
  .sp-tap { margin: 0; font-size: 22px; font-weight: 900; opacity: 0; color: var(--ink); }
  .sp-tap.on { opacity: 1; animation: tapP 1s ease-in-out infinite; }
  @keyframes tapP { 50% { transform: scale(1.12); } }

  /* ---------- menu ---------- */
  .ops { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; padding-bottom: 36px; }
  .op { max-width: 260px; animation: slideIn .5s cubic-bezier(.2, 1.3, .4, 1) both; animation-delay: calc(var(--i) * 90ms + 100ms); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-60px) scale(.9); } }
  .lvtag {
    position: absolute; top: -9px; right: 16px; background: #fff; color: #111; border: 3px solid #111; border-radius: 999px;
    padding: 0 10px; font-size: 12px; line-height: 20px; font-weight: 900; pointer-events: none;
  }

  /* ---------- play ---------- */
  .ptop { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-bottom: 6px; }
  .ptop .ib { justify-self: start; }
  .ptop h2 { margin: 0; font-size: 28px; font-weight: 900; text-align: center; color: var(--ink); }
  .ptop h2.bump3 { animation: bump3 .5s; }
  @keyframes bump3 { 40% { transform: scale(1.25); } }
  .pill {
    justify-self: end; display: flex; align-items: center; gap: 6px; border: 4px solid var(--frame); background: var(--paper);
    border-radius: 999px; padding: 4px 12px; font-size: 16px; font-weight: 900; color: var(--ink);
  }
  .coin { display: inline-block; flex: none; width: 15px; height: 15px; border-radius: 50%; background: #FFC933; border: 2.5px solid #111; }
  .coin.s { width: 11px; height: 11px; border-width: 2px; }
  .statbar { display: flex; justify-content: center; gap: 10px; padding-bottom: 8px; }
  .stat { display: flex; align-items: center; gap: 6px; border: 4px solid var(--frame); background: var(--paper); border-radius: 999px; padding: 4px 12px; font-size: 16px; font-weight: 900; color: var(--ink); }
  .stat.fire span { font-size: 17px; }
  .badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: #111; color: #fff; font-size: 11px; font-weight: 900; display: grid; place-items: center; border: 2px solid var(--paper); }

  .mainarea { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 10px; }
  .sum { width: fit-content; max-width: 100%; font-size: var(--sf, 56px); line-height: 1.16; font-weight: 900; color: var(--ink); font-variant-numeric: tabular-nums; }
  .sum.rise { animation: rise .32s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.9); } }
  .sr { display: flex; justify-content: flex-end; align-items: baseline; }
  .sr .sg { margin-right: auto; padding-right: .3em; }
  .dash { height: 5px; margin: 10px -.45em 0; background: repeating-linear-gradient(to right, var(--ink) 0, var(--ink) 10px, transparent 10px, transparent 15px); }

  .opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 10px; margin-top: 54px; max-width: 100%; }
  .opt {
    min-width: 68px; min-height: 62px; padding: 4px 16px; border: 4px solid transparent; border-radius: 999px; background: transparent;
    font-size: var(--of, 30px); font-weight: 900; color: var(--ink); font-variant-numeric: tabular-nums;
    animation: popIn .34s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: calc(var(--i) * 70ms + 120ms);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(.4); } }
  .opt:active:not(:disabled) { background: rgba(127, 127, 127, .16); }
  .opt:disabled { cursor: default; }
  .opt.good { background: var(--accent); border-color: #111; color: #111; animation: goodP .55s; }
  @keyframes goodP { 0% { transform: scale(1); } 35% { transform: scale(1.35) rotate(-4deg); } 100% { transform: scale(1); } }
  .opt.reveal { border-color: #1B8A4B; color: #1B8A4B; }
  .opt.bad { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 4px; animation: shake .35s; }
  .opt.dim { opacity: .22; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .tools { display: flex; justify-content: center; gap: 34px; padding: 0 6px; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .cap { display: flex; align-items: center; gap: 4px; min-height: 16px; font-size: 11px; font-weight: 800; color: var(--ink); white-space: nowrap; }

  .flash { position: absolute; inset: 0; z-index: 14; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(255, 40, 40, .6) 100%); }
  .flash.go { animation: flashA .8s; }
  @keyframes flashA { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

  /* ---------- win / game over overlays ---------- */
  .ov { position: absolute; inset: 0; z-index: 15; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; overflow: hidden; }
  .ov.on { display: flex; animation: ovIn .3s ease-out; }
  @keyframes ovIn { from { opacity: 0; } }
  .ov.win { background: rgba(22, 16, 46, .78); }
  .ov.over { background: rgba(10, 10, 24, .88); }
  .ov > * { position: relative; z-index: 2; }
  .rays { position: absolute !important; z-index: 1 !important; left: 50%; top: 30%; width: 560px; height: 560px; margin: -280px 0 0 -280px; border-radius: 50%;
    background: repeating-conic-gradient(rgba(255, 226, 120, .42) 0 9deg, transparent 9deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 0, transparent 68%); mask-image: radial-gradient(circle, #000 0, transparent 68%);
    animation: spin 14s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .rain { position: absolute !important; inset: 0; z-index: 3 !important; pointer-events: none; overflow: hidden; }
  .rain span { position: absolute; top: -50px; animation: rainFall var(--t, 3s) linear var(--dl, 0s) forwards; }
  @keyframes rainFall { to { transform: translateY(115vh) rotate(var(--r, 360deg)); } }

  .face { font-size: 118px; line-height: 1; }
  .win-face { animation: faceIn .9s cubic-bezier(.2, 1.7, .4, 1) both, jig 1.3s .9s ease-in-out infinite; }
  @keyframes faceIn { from { transform: scale(0) rotate(-240deg); } }
  @keyframes jig { 0%, 100% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(8deg) scale(1.1); } }
  .big { margin: 0; font-size: 34px; font-weight: 900; line-height: 1.1; }
  .win .big { animation: titleIn .7s .25s cubic-bezier(.2, 1.5, .4, 1) both; }
  .stars { display: flex; gap: 6px; font-size: 44px; line-height: 1; }
  .stars span { opacity: .22; filter: grayscale(1); transform: scale(.5); transition: all .3s; }
  .stars span.on { opacity: 1; filter: none; animation: starPop .6s cubic-bezier(.2, 1.8, .4, 1) both; }
  @keyframes starPop { from { transform: scale(0) rotate(-120deg); } }
  .reward { display: flex; align-items: center; gap: 8px; font-size: 30px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #111; margin-bottom: 6px; }
  .reward .coin { width: 26px; height: 26px; border-width: 3.5px; animation: coinSpin 1.2s linear infinite; }
  @keyframes coinSpin { 50% { transform: scaleX(.25); } }

  .face-wrap { position: relative; }
  .sad { animation: dropSad .8s cubic-bezier(.3, 1.4, .5, 1) both, sway 2.6s .85s ease-in-out infinite alternate; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .5)); }
  @keyframes dropSad { from { transform: translateY(-160px) scale(.5); opacity: 0; } }
  @keyframes sway { from { transform: rotate(-7deg) translateY(0); } to { transform: rotate(6deg) translateY(8px) scale(.97); } }
  .tear { position: absolute; top: 60%; font-size: 26px; opacity: 0; animation: tear 1.6s ease-in infinite; }
  .tear.t1 { left: 26%; animation-delay: 1s; }
  .tear.t2 { left: 64%; animation-delay: 1.8s; }
  @keyframes tear { 0% { opacity: 0; transform: translateY(0) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(70px) scale(1); } }
  .go-title { margin: 6px 0 0; font-size: 50px; font-weight: 900; line-height: 1; animation: goIn .7s .5s cubic-bezier(.2, 1.6, .4, 1) both; filter: drop-shadow(0 0 14px rgba(255, 60, 60, .7)); }
  @keyframes goIn { from { transform: translateY(-40px) scale(.4); opacity: 0; } }
  .go-sub { margin: 0 0 8px; font-size: 15px; font-weight: 600; color: #E7E7F3; opacity: 0; animation: ovIn .5s 1s forwards; }
  .go-row { display: flex; align-items: flex-start; justify-content: center; gap: 18px; margin-top: 10px; }
  .go-row .cap { color: #E7E7F3; }
  .btn-in { animation: slideUp .5s 1s both; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } }
  .win .btn-in { animation-delay: 1.5s; }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0, 0, 0, .5); }
  .modal.on { display: flex; animation: ovIn .2s; }
  .card { position: relative; width: 100%; max-width: 360px; max-height: 92%; overflow-y: auto; background: var(--paper); color: var(--ink); border: 5px solid var(--frame); border-radius: 30px; padding: 22px 20px; animation: cardIn .3s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes cardIn { from { transform: scale(.85); opacity: 0; } }
  .card h3 { margin: 0 44px 14px 0; font-size: 22px; font-weight: 900; }
  .xbtn { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 3px solid #111; background: var(--accent); padding: 8px; display: grid; place-items: center; }
  .xbtn img { width: 100%; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 2px dashed var(--line); font-size: 16px; }
  .row:first-of-type { border-top: 0; }
  .row .nm { flex: 1; display: flex; align-items: center; gap: 12px; }
  .row .ib { width: 48px; height: 48px; }
  .sw { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #111; flex: none; }
  .mbtn { border: 4px solid #111; border-radius: 999px; background: var(--accent); color: #111; padding: 6px 16px; font-size: 14px; font-weight: 900; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .mbtn:disabled { background: transparent; color: var(--ink); border-color: var(--line); cursor: default; }
  .mbtn.big { width: 100%; justify-content: center; font-size: 18px; padding: 12px; gap: 10px; }
  .mbtn img.ai { width: 26px; height: auto; flex: none; }
  .ib.empty { opacity: .4; }
  .note { margin: 6px 0 0; font-size: 14px; font-weight: 600; opacity: .85; line-height: 1.45; }
  .bigcoin { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 44px; font-weight: 900; margin: 6px 0 10px; }
  .bigcoin .coin { width: 34px; height: 34px; border-width: 4px; }

  .wheel-wrap { position: relative; width: 250px; height: 250px; margin: 22px auto 18px; }
  .ptr { position: absolute; left: 50%; top: -24px; width: 30px; margin-left: -15px; z-index: 3; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .35)); }
  .wheel-rot { width: 100%; height: 100%; transform-origin: 49.6% 48.3%; will-change: transform; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .3)); }

  .toast { position: fixed; left: 50%; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 45; background: #111; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; }
  .toast.on { opacity: 1; }
  #fx { position: fixed; inset: 0; z-index: 40; pointer-events: none; }

  @media (max-height: 700px) {
    .ops { gap: 12px; }
    .pillbtn { max-width: 290px; }
    .opts { margin-top: 30px; }
    .face { font-size: 96px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="frame" id="frame">
    <div class="fl" id="fl" aria-hidden="true"></div>

    <!-- MENU -->
    <section class="scr" id="menu">
      <div class="toprow">
        <button class="ib" id="bSet" type="button" data-img="setting" aria-label="Settings"></button>
        <button class="ib wobble" id="bWheel" type="button" aria-label="Lucky wheel"><span data-img="wheel" data-cls="nof"></span><i class="dot" id="wheelDot"></i></button>
        <button class="ib" id="bShop" type="button" data-img="shop" aria-label="Shop"></button>
        <button class="ib" id="bWallet" type="button" aria-label="Wallet"><span data-img="wallet"></span><span class="bal" id="balMenu">0</span></button>
      </div>
      <div class="statbar"><div class="stat fire"><span>&#128293;</span><b id="fireMenu">0</b></div></div>
      <div class="ops" id="ops"></div>
    </section>

    <!-- PLAY -->
    <section class="scr" id="play">
      <div class="ptop">
        <button class="ib" id="bPause" type="button" data-img="setting" aria-label="Pause, sound aur home"></button>
        <h2 id="lvTitle">level 1</h2>
        <span></span>
      </div>
      <div class="statbar">
        <div class="stat fire"><span>&#128293;</span><b id="fireN">0</b></div>
        <div class="stat coin" id="pillPlay"><i class="coin"></i><b id="balPlay">0</b></div>
      </div>
      <div class="mainarea">
        <div class="sum" id="sum"></div>
        <div class="opts" id="opts"></div>
      </div>
      <div class="tools">
        <div class="tool"><button class="ib" id="tSkip" type="button" data-img="refresh" aria-label="Skip, shop se khareeda hua"></button><span class="cap">Skip</span></div>
        <div class="tool"><button class="ib" id="tSwap" type="button" data-img="redo" aria-label="Redo, naya sawal"></button><span class="cap">Redo</span></div>
        <div class="tool"><button class="ib" id="tHint" type="button" data-img="idea" aria-label="Hint, shop se khareeda hua"></button><span class="cap">Hint</span></div>
      </div>
    </section>

    <div class="flash" id="flash"></div>

    <!-- WIN -->
    <div class="ov win" id="ovWin">
      <div class="rays"></div>
      <div class="rain" id="rain" aria-hidden="true"></div>
      <div class="face win-face" id="winFace">&#129395;</div>
      <h2 class="big sticker" id="winTitle">Level Complete!</h2>
      <div class="stars" id="stars" aria-label="Stars"><span>&#11088;</span><span>&#11088;</span><span>&#11088;</span></div>
      <div class="reward"><span>&#128293;</span><span>+<b id="rewardN">0</b></span></div>
      <button class="pillbtn btn-in" id="bNext" type="button" data-img="next" aria-label="Next level"></button>
    </div>

    <!-- GAME OVER -->
    <div class="ov over" id="ovOver">
      <div class="face-wrap"><div class="face sad" id="sadFace">&#128532;</div><span class="tear t1">&#128167;</span><span class="tear t2">&#128167;</span></div>
      <h2 class="go-title sticker">Game Over</h2>
      <p class="go-sub" id="goSub"></p>
      <div class="go-row btn-in">

      later(gameOver, 1100);
    }
  }

  /* ---------- win: faster = more stars = more fire ---------- */
  function win() {
    if (!$("play").classList.contains("on")) return;
    var sec = (performance.now() - cur.t0) / 1000;
    var stars = sec <= 10 ? 3 : sec <= 25 ? 2 : 1;
    var fireGain = stars;
    var done = save.lv[cur.op];
    save.fire += fireGain; save.lv[cur.op]++; persist();
    $("winTitle").textContent = "Level " + done + " Complete!";
    $("rewardN").textContent = "0";
    var st = $("stars").children;
    for (var i = 0; i < 3; i++) st[i].classList.remove("on");
    var face = $("winFace"); face.style.animation = "none"; void face.offsetWidth; face.style.animation = "";
    $("ovWin").classList.add("on");
    emojiRain($("rain"), ["\uD83C\uDF89", "\uD83E\uDD73", "\u2728", "\u2B50", "\uD83E\uDE99", "\uD83C\uDF8A", "\uD83D\uDE0D"], 26);
    sfx("win"); buzz([30, 40, 30, 40, 90]);
    confetti(130);
    for (var s = 0; s < stars; s++) (function (n) {
      later(function () { st[n].classList.add("on"); sfx("star", n); var c = center(st[n]); sparkles(c.x, c.y, 14); }, 900 + n * 380);
    })(s);
    var t0 = performance.now();
    (function count(ts) {
      var k = Math.min(1, (ts - t0 - 900) / 900);
      if (k > 0) $("rewardN").textContent = Math.round(fireGain * k);
      if (k < 1 && $("ovWin").classList.contains("on")) requestAnimationFrame(count); else $("rewardN").textContent = fireGain;
    })(t0);
  }
  function nextLevel() {
    $("ovWin").classList.remove("on");
    setFire(true);
    newQ();
  }

  /* ---------- game over ---------- */
  function gameOver() {
    if (!$("play").classList.contains("on")) return;
    var lvl = save.lv[cur.op];
    $("goSub").textContent = OPS_NAME[cur.op] + " \u2022 Level " + lvl + " \u2022 koi baat nahi, phir try karo!";
    var face = $("sadFace"); face.style.animation = "none"; void face.offsetWidth; face.style.animation = "";
    $("ovOver").classList.add("on");
    refreshBadges();
    sfx("over"); buzz([80, 60, 200]);
  }
  function swapFromOver() {
    if (!payFor("swap")) return;
    hideOverlays();
    newQ();
  }
  function revive() {
    if (!payFor("undo")) return;
    sfx("buy");
    $("ovOver").classList.remove("on");
    var btns = $("opts").children;
    for (var k = 0; k < btns.length; k++) {
      if (k === cur.wrongIdx) continue;
      btns[k].disabled = false; btns[k].classList.remove("dim", "reveal");
    }
    cur.locked = false;
  }

  /* ---------- tools ---------- */
  function useHint() {
    if (cur.locked) return;
    if (cur.hinted) { toast("Is sawal ka hint lag chuka hai"); return; }
    var btns = $("opts").children, cand = [];
    for (var k = 0; k < btns.length; k++) if (!btns[k].disabled && cur.q.opts[k] !== cur.q.ans) cand.push(k);
    if (cand.length < 2) { toast("Ab hint ki zaroorat nahi"); return; }
    if (!payFor("hint")) return;
    shuffle(cand);
    for (var j = 0; j < 2; j++) {
      btns[cand[j]].disabled = true; btns[cand[j]].classList.add("dim");
      var c = center(btns[cand[j]]); sparkles(c.x, c.y, 10, ["#B388FF", "#FFFFFF", "#4CC9F0", "#FFC933"]);
    }
    cur.hinted = true; sfx("hint");
  }
  function swapQ() { if (cur.locked) return; if (payFor("swap")) newQ(); }
  function skipLevel() { if (cur.locked) return; if (payFor("skip")) { save.lv[cur.op]++; persist(); newQ(); } }

  /* ================= modals ================= */
  function openModal(title, html) { $("mTitle").textContent = title; $("mBody").innerHTML = html; $("modal").classList.add("on"); $("mClose").focus({ preventScroll: true }); }
  function closeModal() { $("modal").classList.remove("on"); $("mBody").innerHTML = ""; }

  function openSettings() {
    openModal("Settings",
      '<div class="row"><span class="nm">Sound</span><button class="ib" id="tgSnd" type="button" aria-label="Sound on off">' + img(save.snd ? "sndon" : "sndoff") + '</button></div>' +
      '<div class="row"><span class="nm">Vibration</span><button class="mbtn" id="tgVib" type="button">' + (save.vib ? "On" : "Off") + '</button></div>' +
      '<div class="row"><span class="nm">About</span><button class="ib" id="bAbout" type="button" aria-label="About">' + img("about") + '</button></div>' +
      '<div class="row"><span class="nm">Privacy Policy</span><button class="ib" id="bPriv" type="button" aria-label="Privacy Policy">' + img("privacy") + '</button></div>' +
      '<div class="row"><span class="nm">Saara progress reset</span><button class="ib" id="rst" type="button" aria-label="Reset">' + img("refresh") + '</button></div>' +
      '<p class="note" id="rstNote"></p>');
    $("tgSnd").addEventListener("click", function () { save.snd = !save.snd; persist(); this.innerHTML = img(save.snd ? "sndon" : "sndoff"); if (save.snd) sfx("pop"); });
    $("tgVib").addEventListener("click", function () { save.vib = !save.vib; persist(); this.textContent = save.vib ? "On" : "Off"; buzz(30); });
    $("bAbout").addEventListener("click", function () {
      openModal("About", '<p class="note">Math Master &mdash; jod, ghata, guna aur bhaag ke infinite levels. Har level pichhle se thoda mushkil. Roz Lucky Wheel ghumao aur shop se Redo, Idea, Restart, Undo ke pack kharido.</p><p class="note">Version 1.0</p>');
    });
    $("bPriv").addEventListener("click", function () {
      openModal("Privacy Policy", '<p class="note">Ye game aapki koi personal jaankari collect ya share nahi karta. Levels, coins aur settings sirf aapke apne device mein save hoti hain.</p>');
    });
    var armed = false;
    $("rst").addEventListener("click", function () {
      if (!armed) { armed = true; $("rstNote").textContent = "Pakka? Levels, coins aur shop sab hat jayega. Confirm karne ke liye dobara dabao."; return; }
      save = defaults(); persist(); applyTheme(); renderMenu(); closeModal(); toast("Progress reset ho gaya");
    });
  }

  function openWallet() {
    openModal("Wallet",
      '<div class="bigcoin"><i class="coin"></i><span id="mCoins">' + save.coins + '</span></div>' +
      '<p class="note">Coins sirf Lucky Wheel se milte hain &mdash; roz ek free spin. Shop mein Redo, Idea, Restart aur Undo ke pack khareedo, phir wahi game ke andar istemal karo.</p>');
  }

  function openShop() {
    var html = "";
    SHOP_ITEMS.forEach(function (it) {
      html += '<div class="row"><span class="nm"><span class="ib">' + img(it.img) + '</span><span>' + it.name + '<br><small style="font-weight:600">' + it.sub + ' &middot; +' + it.give + '</small></span></span>' +
        '<button class="mbtn" type="button" data-buy="' + it.key + '"><i class="coin s"></i>' + it.price + '</button></div>';
    });
    openModal("Shop", html + '<p class="note">Coins sirf wheel se milte hain, isliye price 100 rakhi hai &mdash; roz zyada khareed nahi paoge. Yahan se khareedo, phir game ke andar istemal karo.</p>');
    Array.prototype.forEach.call($("mBody").querySelectorAll("button[data-buy]"), function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-buy");
        var it = SHOP_ITEMS.filter(function (x) { return x.key === key; })[0];
        if (!spend(it.price)) return;
        save.inv[key] += it.give; persist(); refreshBadges(); sfx("buy");
        var c = center(b); sparkles(c.x, c.y, 24);
        toast("+" + it.give + " " + it.name);
      });
    });
  }

  function openPause() {
    openModal("Pause",
      '<div class="row"><span class="nm">Sound</span><button class="ib" id="pSnd" type="button" aria-label="Sound on off">' + img(save.snd ? "sndon" : "sndoff") + '</button></div>' +
      '<button class="mbtn big" id="pHome" type="button">' + img("home") + ' Home</button>');
    $("pSnd").addEventListener("click", function () { save.snd = !save.snd; persist(); this.innerHTML = img(save.snd ? "sndon" : "sndoff"); if (save.snd) sfx("pop"); });
    $("pHome").addEventListener("click", function () { closeModal(); showScreen("menu"); });
  }

  function pickWheel() {
    var r = Math.random() * 100, acc = 0;
    for (var i = 0; i < WHEEL_W.length; i++) { acc += WHEEL_W[i]; if (r < acc) return i; }
    return 0;
  }
  function openWheel() {
    var done = save.spin === today();
    openModal("Lucky Wheel",
      '<div class="wheel-wrap"><img class="ai nof ptr" src="' + ASSETS.arrow + '" alt=""><div class="wheel-rot" id="wheelRot">' + img("wheel", "nof") + '</div></div>' +
      '<button class="mbtn big" id="spinBtn" type="button"' + (done ? " disabled" : "") + '>' + (done ? "Kal phir aana" : "Ghumao") + '</button>' +
      '<p class="note" id="spinNote">' + (done ? "Aaj ka spin ho chuka hai." : "Roz ek baar free spin.") + '</p>');
    $("spinBtn").addEventListener("click", function () {
      var btn = this;
      if (save.spin === today()) return;
      btn.disabled = true; btn.textContent = "Ghoom raha hai...";
      save.spin = today(); persist(); $("wheelDot").style.display = "none";
      var idx = pickWheel(), rot = $("wheelRot");
      var target = 360 * 6 + (360 - CENTERS[idx]) + rand(-22, 22);
      var dur = RM ? 300 : 4800, t0 = 0, last = 0;
      sfx("whoosh");
      function frame(ts) {
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur), e = 1 - Math.pow(1 - p, 4), ang = target * e;
        rot.style.transform = "rotate(" + ang + "deg)";
        var tk = Math.floor(ang / 36);
        if (tk > last) { last = tk; sfx("tick"); }
        if (p < 1) requestAnimationFrame(frame); else finish();
      }
      function finish() {
        save.coins += WHEEL[idx]; persist(); setCoins(true);
        sfx("win"); buzz([30, 40, 30, 40, 90]); confetti(120);
        var n = $("spinNote"), b2 = $("spinBtn");
        if (n) n.textContent = "Tumne " + WHEEL[idx] + " coins jeete! \uD83E\uDD73";
        if (b2) b2.textContent = "Kal phir aana";
        toast("+" + WHEEL[idx] + " coins");
      }
      requestAnimationFrame(frame);
    });
  }

  /* ================= events ================= */
  document.addEventListener("pointerdown", audioInit);
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (b && !b.classList.contains("opt")) sfx("tap");
  }, true);
  $("bSet").addEventListener("click", openSettings);
  $("bWheel").addEventListener("click", openWheel);
  $("bShop").addEventListener("click", openShop);
  $("bWallet").addEventListener("click", openWallet);
  $("mClose").addEventListener("click", closeModal);
  $("modal").addEventListener("click", function (e) { if (e.target === this) closeModal(); });
  $("ops").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".op") : null;
    if (!b) return;
    cur.op = b.getAttribute("data-op");
    showScreen("play"); setCoins(); newQ();
  });
  $("bPause").addEventListener("click", openPause);
  $("tHint").addEventListener("click", useHint);
  $("tSwap").addEventListener("click", swapQ);
  $("tSkip").addEventListener("click", skipLevel);
  $("bNext").addEventListener("click", nextLevel);
  $("bRestart").addEventListener("click", retrySame);
  $("bSwapOver").addEventListener("click", swapFromOver);
  $("bHomeOver").addEventListener("click", function () { showScreen("menu"); });
  $("bRevive").addEventListener("click", revive);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
    if ($("play").classList.contains("on") && !$("modal").classList.contains("on") && e.key >= "1" && e.key <= "4") choose(parseInt(e.key, 10) - 1);
  });

  /* ================= start ================= */
  initImages();
  applyTheme();
  floaters();
  var splashDone = false;
  function leaveSplash() {
    if (splashDone) return; splashDone = true;
    audioInit(); sfx("pop");
    var sp = $("splash"); sp.classList.add("out");
    later(function () { sp.classList.remove("on", "out"); showScreen("menu"); sfx("whoosh"); }, 340);
  }
  $("spFill").addEventListener("animationend", function () { $("spTap").classList.add("on"); });
  later(function () { $("spTap").classList.add("on"); }, 1500);
  $("splash").addEventListener("click", leaveSplash);
  renderMenu();
})();
</script>
</body>
</html>
