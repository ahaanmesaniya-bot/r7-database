<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tap Away Arrows</title>
<style>
:root{--bg:#fff;--fg:#434b6b;--ink:#0b1448;--chip:#eef3f9;--dot:#c4c9d2;--blue:#1e88e5;--red:#e53935;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142a;--fg:#c9d0ee;--ink:#e4e8f7;--chip:#1c2240;--dot:#3a4166}}
:root[data-theme="dark"]{--bg:#10142a;--fg:#c9d0ee;--ink:#e4e8f7;--chip:#1c2240;--dot:#3a4166}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1{font-size:clamp(30px,9vw,46px);margin:14px 0 8px;text-align:center;line-height:1.1}
.bar{width:min(100%,460px);display:flex;align-items:center;justify-content:space-between;padding:6px 14px;box-sizing:border-box;gap:8px}
.chip{background:var(--chip);border-radius:14px;padding:10px 16px;font-weight:700;font-size:18px;min-width:70px;text-align:center}
.lvl{font-weight:700;font-size:20px;color:var(--ink)}
#hearts{font-size:30px;letter-spacing:4px}
canvas{touch-action:none;margin:6px 0}.shake{animation:sh .35s}@keyframes sh{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.tools{display:flex;gap:44px;margin-top:6px}
.btn{position:relative;width:70px;height:70px;border-radius:50%;border:0;background:var(--chip);color:var(--blue);font-size:30px;cursor:pointer;box-shadow:0 6px 16px rgba(30,136,229,.18)}
.btn:active{transform:scale(.94)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;font-size:15px;line-height:26px;font-weight:700}
#ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(#1e88e5,#42a5f5);color:#fff;text-align:center;z-index:5}
#ov h2{font-size:38px;margin:0}
#ov button{background:#fff;color:#1e88e5;border:0;border-radius:40px;padding:18px 60px;font-size:22px;font-weight:700;cursor:pointer}
#ov.lose{background:linear-gradient(#c62828,#ef5350)}#ov.lose button{color:#c62828}
#glow{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 18px rgba(229,57,53,.55);opacity:0;z-index:4}
#glow.on{animation:gl .7s}@keyframes gl{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
#hearts span{display:inline-block}.hs{animation:hs .4s}.hb{animation:hb .6s}
@keyframes hs{25%{transform:translateX(-4px) rotate(-8deg)}75%{transform:translateX(4px) rotate(8deg)}}
@keyframes hb{30%{transform:scale(1.6) rotate(-15deg)}100%{transform:scale(1)}}
.btn.sel{outline:3px solid var(--blue)}
#wd{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);display:none;z-index:6;background:var(--bg);padding:12px 26px;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.25);text-align:center;font-weight:800;font-size:26px;color:var(--blue);animation:pp .35s}
@keyframes pp{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
#cf{position:absolute;inset:0;margin:0;pointer-events:none}
#snap{width:min(70vw,320px);border-radius:22px;display:none}
#gl2{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 18px rgba(255,193,7,.6);opacity:0;z-index:4}#gl2.on{animation:gl .7s}
#cmb{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:clamp(34px,11vw,56px);font-weight:900;font-style:italic;pointer-events:none;z-index:4;opacity:0;text-shadow:0 3px 0 rgba(0,0,0,.15),0 0 18px currentColor}
#cmb.on{animation:cb 1.2s}@keyframes cb{0%{transform:scale(.3) rotate(-6deg);opacity:0}15%{transform:scale(1.35) rotate(3deg);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
#stars span{display:inline-block;font-size:50px;animation:st .5s both}
@keyframes st{0%{transform:scale(0) rotate(-90deg);opacity:0}70%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1);opacity:1}}
#ov.lose h2{animation:hs .6s}
#ov{background:linear-gradient(#18a0ff 0%,#0a6cf0 100%);overflow:hidden;gap:12px}
#ov::before{content:"";position:absolute;left:50%;top:62%;width:260vmax;height:260vmax;margin:-130vmax 0 0 -130vmax;background:repeating-conic-gradient(rgba(255,255,255,.14) 0 7deg,transparent 7deg 14deg);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#ov>*{position:relative}
#cf{position:absolute}
#ov #ovh{font-size:clamp(38px,12vw,56px);font-weight:800;line-height:1.05;margin-bottom:18px}
#ov h2{font-size:clamp(30px,9.5vw,44px);font-weight:800}
#ov #snap{width:min(70vw,320px,32vh);padding:14px;box-sizing:border-box;background:#fff;box-shadow:0 16px 34px rgba(0,50,150,.35)}
#ov #ovb{width:min(84vw,420px);padding:20px 0;font-size:24px;box-shadow:0 8px 20px rgba(0,50,150,.3)}
#ov #ovm{background:none;color:#fff;padding:8px;font-size:22px;font-weight:700}
h1{display:none}
.hide{display:none!important}
#game{display:flex;flex-direction:column;align-items:center;width:100%;height:100%}
.top{width:min(100%,460px);display:flex;justify-content:space-between;align-items:center;padding:10px 14px 0;box-sizing:border-box}
.ic{width:56px;height:56px;cursor:pointer}
.btn{background:none!important;box-shadow:none!important;width:80px;height:80px;padding:0}
.btn img{width:100%;height:100%;display:block}
.tools{gap:26px}
#menu{position:fixed;inset:0;background:var(--bg);z-index:3}
#menu .mid{position:absolute;left:0;right:0;top:44%;display:flex;flex-direction:column;align-items:center;gap:14px}
#menu .mb{width:min(62vw,300px);cursor:pointer}
#menu .mb:active,.ic:active{transform:scale(.94)}
#mt{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:clamp(34px,10vw,52px);font-weight:900;color:var(--fg);line-height:1.05}
#mg{position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top,0px))}
#wheel{position:absolute;left:16px;top:calc(92px + env(safe-area-inset-top,0px));width:72px;height:72px;border-radius:50%;border:5px solid #f5b800;box-sizing:border-box;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:pointer}
#wheel::after{content:"";position:absolute;top:-12px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#e53935}
#wr{position:relative;width:100%;height:100%;border-radius:50%;transition:transform 3.4s cubic-bezier(.1,.7,.1,1)}
#wr b{position:absolute;left:50%;top:50%;width:22px;margin:-7px 0 0 -11px;font-size:10px;text-align:center;color:#fff;text-shadow:0 1px 2px #000}
#wt{position:absolute;left:16px;top:calc(168px + env(safe-area-inset-top,0px));width:72px;text-align:center;font-weight:800;font-size:13px;color:var(--fg)}
#wheel.no{animation:sh .35s}
#wal{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;cursor:pointer}
#wal img{width:56px}#wal b{font-size:22px;color:var(--fg)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:7}
.card{background:var(--bg);border-radius:26px;padding:22px;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:88vw;box-sizing:border-box}
.card .ic{width:78px;height:78px}
#shop .card{flex-direction:column;gap:14px;min-width:min(86vw,360px)}
.row{display:flex;align-items:center;gap:14px;width:100%}
.row img{width:56px}.row span{flex:1;font-weight:800;font-size:20px;color:var(--ink)}
.buy{border:0;border-radius:30px;background:#4caf50;color:#fff;font-weight:800;font-size:18px;padding:12px 18px;cursor:pointer;border:3px solid #000}
#ov #nxt{width:min(72vw,300px);cursor:pointer}
#ov #hm2{width:64px;cursor:pointer}
#ovb,#ovm{display:none!important}
#wheel{border:0!important;box-shadow:none!important;width:80px!important;height:80px!important}
#wheel::after{display:none}
#wr img{width:100%;height:100%;display:block}
#wp{position:absolute;top:-9px;left:50%;width:20px;margin-left:-10px;z-index:2}
#wt{top:calc(172px + env(safe-area-inset-top,0px))!important}
.card{max-height:92vh;overflow:auto}
.card{position:relative}.xb{position:absolute;top:-14px;right:-10px;width:42px;height:42px;border-radius:50%;border:3px solid #000;background:#e53935;color:#fff;font-size:20px;font-weight:900;cursor:pointer}.xb:active{transform:scale(.92)}
#wprize{position:absolute;left:96px;top:calc(110px + env(safe-area-inset-top,0px));font-weight:900;font-size:26px;color:#f5b800;text-shadow:0 2px 0 #000;opacity:0;pointer-events:none}#wprize.on{animation:wpz 1.6s}@keyframes wpz{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.3)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
html,body{height:100dvh}#game{height:100dvh;padding-bottom:max(12px,env(safe-area-inset-bottom))}canvas#c{flex:none;margin:auto 0}.top,.bar{width:min(100%,640px)}
#tip{display:none;font-weight:800;color:var(--blue);text-align:center;padding:0 18px 8px;font-size:16px;line-height:1.25;max-width:520px}
#hand{position:fixed;display:none;width:72px;z-index:4;pointer-events:none;transform-origin:26% 4%;animation:tp .9s ease-in-out infinite}
@keyframes tp{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-3px,-5px) scale(.8)}}
#cw{flex:none;margin:auto 0;overflow:hidden;border-radius:0;outline:none;box-shadow:none;background:none;touch-action:none;position:relative}
#cw canvas{display:block;margin:0;transform-origin:0 0;will-change:transform}

.ct{width:100%;margin:0;text-align:center;font-size:26px;font-weight:900;color:#1e88e5}
.xb{width:48px;height:48px;top:-18px;right:-14px;border:4px solid #fff;background:linear-gradient(#ff6b6b,#d32f2f);font-size:24px;line-height:1;box-shadow:0 0 0 3px #000,0 6px 10px rgba(0,0,0,.4)}
.rb{width:100%;border:0;border-radius:40px;background:#4caf50;color:#fff;font-size:22px;font-weight:800;padding:14px 0;cursor:pointer;box-shadow:0 5px 0 #2e7d32}.rb:active{transform:translateY(4px);box-shadow:0 1px 0 #2e7d32}.rb:disabled{background:#9e9e9e;box-shadow:0 5px 0 #757575}
.sp{flex-direction:column;width:min(88vw,360px)}
#bwb{position:relative;width:min(68vw,270px);height:min(68vw,270px);margin-top:10px}#bwr{width:100%;height:100%;transition:transform 4.6s cubic-bezier(.12,.7,.1,1);filter:drop-shadow(0 0 14px #ffd23f)}#bwr img{width:100%;height:100%;display:block}
#bp{position:absolute;top:-16px;left:50%;width:40px;margin-left:-20px;transform-origin:50% 20%;z-index:2}
#sres{font-size:20px;font-weight:800;min-height:26px;text-align:center;color:#333}
#ov.lose{background:linear-gradient(#18a0ff 0%,#0a6cf0 100%)}#ov.lose h2{animation:none}
.xb{top:10px!important;right:10px!important}.card{padding-top:30px}


#ov.lose #nxt{width:min(32vw,130px)}
#sgo,#wheel{touch-action:manipulation;-webkit-tap-highlight-color:transparent}#wheel{width:88px!important;height:88px!important}#sgo{min-height:54px}
</style><style id="lock">
html{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:none}
body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none!important;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@supports(height:100dvh){body{height:100dvh}}
#cw,#cw canvas{touch-action:none!important}
.card{touch-action:pan-y;overscroll-behavior:contain}
#sgo,#wheel,.btn,.ic,.mb,.buy,.rb,.xb{touch-action:none!important}
img{-webkit-user-drag:none;user-select:none}
</style>
</head><body>

</div>

document.addEventListener('wheel',e=>{if(e.ctrlKey&&!e.target.closest('#cw'))e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});
scrollTo(0,0);
start();draw();
</script></body></html>
